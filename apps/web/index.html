<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SatsLoom issues real BOLT11 invoices, settles them over Lightning on Bitcoin signet, and credits a payment only when the preimage hashes to the invoice's payment hash." />
    <title>SatsLoom — Bitcoin signet payments, verified by preimage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230D0B07'/%3E%3Cpath d='M6 10h20M6 16h20M6 22h20' stroke='%23F7931A' stroke-width='2'/%3E%3Cpath d='M11 5v22M21 5v22' stroke='%23EFE7D3' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Set the theme before first paint so there is no flash of the wrong palette. Stored choice
      // wins; otherwise follow the OS. Kept inline and tiny on purpose.
      (function () {
        try {
          var saved = localStorage.getItem("satsloom-theme");
          var theme = saved === "light" || saved === "dark" ? saved
            : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
